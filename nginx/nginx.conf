events {
    worker_connections 1024;
}

http {
    # Basic optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Map for connection upgrade (WebSocket support)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Upstream backend (service name must match docker-compose)
    upstream backend_servers {
        server api:8080;
        # nếu muốn health check/weight/backup, cấu hình thêm ở đây
    }

    server {
        listen 80;
        server_name _;           # thay bằng domain thật nếu có
        # Redirect all to https
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name _;           # thay bằng domain thật

        ssl_certificate /etc/nginx/certs/nginx.crt;
        ssl_certificate_key /etc/nginx/certs/nginx.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Optional: enable OCSP stapling if CA supports it
        # ssl_stapling on;
        # ssl_stapling_verify on;
        # resolver 8.8.8.8 8.8.4.4 valid=300s;
        # resolver_timeout 5s;

        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log warn;
        client_max_body_size 5M;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header X-XSS-Protection "1; mode=block" always;
        # Content-Security-Policy tùy app, cân nhắc thêm sau.

        # Main proxy
        location / {
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;

            # Headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Buffering (streaming APIs / SSE disable buffering)
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # Health check endpoint
        location /health {
            access_log off;
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Small response timeout
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        # Optional: static files caching (example)
        # location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico)$ {
        #     expires 7d;
        #     add_header Cache-Control "public";
        # }
    }
}