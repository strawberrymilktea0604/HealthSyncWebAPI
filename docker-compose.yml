version: '3.8'

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: healthsync-db
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong!Passw0rd123
      - MSSQL_PID=Express
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - healthsync-network

  minio:
    image: minio/minio
    container_name: healthsync-minio
    environment:
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - healthsync-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    deploy:
      replicas: 2
    depends_on:
      - db
      - minio
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db,1433;Database=HealthSyncDb;User Id=sa;Password=YourStrong!Passw0rd123;TrustServerCertificate=True;
      - MinIO__Endpoint=minio:9000
      - MinIO__AccessKey=minioadmin
      - MinIO__SecretKey=minioadmin
      - MinIO__BucketName=healthsync-images
      - MinIO__UseSSL=false
      # - Authentication__Google__ClientId=your-client-id.apps.googleusercontent.com
    networks:
      - healthsync-network

  nginx:
    image: nginx:1.25-alpine
    container_name: healthsync-nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - healthsync-network

volumes:
  sqlserver_data:
  minio_data:

networks:
  healthsync-network:
    driver: bridge