version: '3.8'

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: healthsync-db
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${DB_SA_PASSWORD}
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - healthsync-network

  minio:
    image: minio/minio
    container_name: healthsync-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - healthsync-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: healthsync-api
    ports:
      - "8080:8080"
    depends_on:
      - db
      - minio
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db,1433;Database=HealthSyncDb;User Id=sa;Password=${DB_SA_PASSWORD};TrustServerCertificate=True;
      - MinIO__Endpoint=minio:9000
      - MinIO__AccessKey=${MINIO_ACCESS_KEY}
      - MinIO__SecretKey=${MINIO_SECRET_KEY}
      - MinIO__BucketName=${MINIO_BUCKET_NAME}
      - MinIO__UseSSL=false
      # - Authentication__Google__ClientId=your-client-id.apps.googleusercontent.com
    networks:
      - healthsync-network

  nginx:
    image: nginx:1.25-alpine
    container_name: healthsync-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - api
    networks:
      - healthsync-network

  jenkins:
    image: jenkins/jenkins:lts-alpine
    container_name: healthsync-jenkins
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./Jenkinsfile:/var/jenkins_home/Jenkinsfile:ro
    environment:
      - JENKINS_OPTS=--httpPort=8080
    networks:
      - healthsync-network

volumes:
  sqlserver_data:
  minio_data:
  jenkins_data:

networks:
  healthsync-network:
    driver: bridge