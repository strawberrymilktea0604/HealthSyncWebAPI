services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: healthsync-db
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - healthsync-network

  minio:
    image: minio/minio:latest
    container_name: healthsync-minio
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - healthsync-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  sqlserver_data:
  minio_data:

networks:
  healthsync-network:
    driver: bridge