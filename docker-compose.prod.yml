services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: healthsync-db-prod
    env_file:
      - .env.prod
    environment:
      - MSSQL_PID=Standard
      - ACCEPT_EULA=Y
      # Pass SA_PASSWORD trực tiếp từ env file vào biến môi trường
      - SA_PASSWORD=${SA_PASSWORD} 
    ports:
      - "1533:1433"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 40s
    networks:
      - healthsync-network

  minio:
    image: minio/minio:latest
    container_name: healthsync-minio-prod
    # KHÔNG dùng env_file để tránh biến thừa
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_SERVER_URL: ${MINIO_SERVER_URL}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL}
    ports:
      - "9004:9000"
      - "9005:9001"
    volumes:
      - minio_data_prod:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - healthsync-network

  api:
    image: healthsync-api:latest
    env_file:
      - .env.prod
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      # Đã xóa các giá trị mặc định (:-minioadminprod), bắt buộc lấy từ .env
      - JwtSettings__SecretKey=${JWT_SECRET_KEY}
      - MinIO__Endpoint=minio:9000
      - MinIO__AccessKey=${MINIO_ROOT_USER}      # Dùng chung biến Root User cho đồng bộ
      - MinIO__SecretKey=${MINIO_ROOT_PASSWORD}  # Dùng chung biến Root Pass cho đồng bộ
      - MinIO__BucketName=${MINIO_BUCKET_NAME}
      - MinIO__UseSSL=false
    restart: unless-stopped
    depends_on:
      - db
      - minio
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
    deploy:
      replicas: 2
    volumes:
      - data_protection_keys:/root/.aspnet/DataProtection-Keys
    networks:
      - healthsync-network

  nginx:
    image: ${DOCKER_HUB_REPO}-nginx:latest # Bỏ hardcode fallback
    container_name: healthsync-nginx-prod
    ports:
      - "9180:80"
      - "9443:443"
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - healthsync-network
    healthcheck:
      test: ["CMD", "curl", "-f", "-k", "https://127.0.0.1:443/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  tunnel-nginx:
    build:
      context: .
      dockerfile: Dockerfile.loophole
    container_name: healthsync-tunnel-nginx
    restart: unless-stopped
    command: ["http", "80", "nginx", "--hostname", "hs-api"]
    volumes:
      - /home/lakhanh/.loophole/tokens.json:/root/.loophole/tokens.json
    depends_on:
      - nginx
    networks:
      - healthsync-network

  tunnel-minio:
    build:
      context: .
      dockerfile: Dockerfile.loophole
    container_name: healthsync-tunnel-minio
    restart: unless-stopped
    command: ["http", "9000", "minio", "--hostname", "hs-files"]
    volumes:
      - /home/lakhanh/.loophole/tokens.json:/root/.loophole/tokens.json
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - healthsync-network

  tunnel-minio-console:
    build:
      context: .
      dockerfile: Dockerfile.loophole
    container_name: healthsync-tunnel-minio-console
    restart: unless-stopped
    command: ["http", "9001", "minio", "--hostname", "hs-console"]
    volumes:
      - /home/lakhanh/.loophole/tokens.json:/root/.loophole/tokens.json
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - healthsync-network

volumes:
  sqlserver_data_prod:
  minio_data_prod:
  data_protection_keys:

networks:
  healthsync-network:
    driver: bridge