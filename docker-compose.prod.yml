services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: healthsync-db-prod
    env_file:
      - .env.prod
    environment:
      - MSSQL_PID=Standard
      - ACCEPT_EULA=Y
      # Pass SA_PASSWORD trực tiếp từ env file vào biến môi trường
      - SA_PASSWORD=${SA_PASSWORD} 
    ports:
      - "1533:1433"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 40s
    networks:
      - healthsync-network

  minio:
    image: minio/minio:latest
    container_name: healthsync-minio-prod
    # KHÔNG dùng env_file để tránh biến thừa
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Dùng internal URLs trong Docker network - không cần Quick Tunnel URLs
      MINIO_SERVER_URL: http://minio:9000
      MINIO_BROWSER_REDIRECT_URL: http://minio:9001
    ports:
      - "9004:9000"
      - "9005:9001"
    volumes:
      - minio_data_prod:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - healthsync-network

  # ========================================
  # MIGRATION INIT CONTAINER (Chạy trước API)
  # ========================================
  # Container này chỉ chạy migrations một lần duy nhất
  # Tránh race condition khi có nhiều API replicas
  # Image được build sẵn trong Jenkins và push lên Docker Hub
  migrator:
    image: healthsync-migrator:latest  # Sẽ được sed thay thế bằng ${DOCKER_HUB_REPO}-migrator:latest
    container_name: healthsync-migrator-prod
    env_file:
      - .env.prod
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=${ConnectionStrings__DefaultConnection}
      - ConnectionStrings__HangfireConnection=${ConnectionStrings__HangfireConnection}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - healthsync-network
    restart: "no" # Chỉ chạy 1 lần, không restart

  api:
    image: healthsync-api:latest
    env_file:
      - .env.prod
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      # Đã xóa các giá trị mặc định (:-minioadminprod), bắt buộc lấy từ .env
      - JwtSettings__SecretKey=${JWT_SECRET_KEY}
      # API dùng internal MinIO endpoint trong Docker network (không qua Quick Tunnel)
      - MinIO__Endpoint=minio:9000
      - MinIO__AccessKey=${MINIO_ROOT_USER}      # Dùng chung biến Root User cho đồng bộ
      - MinIO__SecretKey=${MINIO_ROOT_PASSWORD}  # Dùng chung biến Root Pass cho đồng bộ
      - MinIO__BucketName=${MINIO_BUCKET_NAME}
      - MinIO__UseSSL=false
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
    deploy:
      replicas: 2
    volumes:
      - data_protection_keys:/root/.aspnet/DataProtection-Keys
    networks:
      - healthsync-network

  nginx:
    image: ${DOCKER_HUB_REPO}-nginx:latest # Bỏ hardcode fallback
    container_name: healthsync-nginx-prod
    ports:
      - "9180:80"
      - "9443:443"
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - healthsync-network
    healthcheck:
      test: ["CMD", "curl", "-f", "-k", "https://127.0.0.1:443/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  tunnel-nginx:
    build:
      context: .
      dockerfile: Dockerfile.cloudflared
    container_name: healthsync-tunnel-nginx
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--url", "http://nginx:80"]
    depends_on:
      - nginx
    networks:
      - healthsync-network

  tunnel-minio:
    build:
      context: .
      dockerfile: Dockerfile.cloudflared
    container_name: healthsync-tunnel-minio
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--url", "http://minio:9000"]
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - healthsync-network

  tunnel-minio-console:
    build:
      context: .
      dockerfile: Dockerfile.cloudflared
    container_name: healthsync-tunnel-minio-console
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--url", "http://minio:9001"]
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - healthsync-network

volumes:
  sqlserver_data_prod:
  minio_data_prod:
  data_protection_keys:

networks:
  healthsync-network:
    driver: bridge