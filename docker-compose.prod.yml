services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: healthsync-db-prod
    env_file:
      - .env.prod
    environment:
      - MSSQL_PID=Standard
      - ACCEPT_EULA=Y
    ports:
      - "1533:1433"  # Port 1533 để tránh xung đột
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 40s
    networks:
      - healthsync-network

  minio:
    image: minio/minio:latest
    container_name: healthsync-minio-prod
    env_file:
      - .env.prod
    environment:
      - MINIO_ROOT_USER=minioadminprod
      - MINIO_ROOT_PASSWORD=minioadminprod
      # Public URLs cho Loophole tunnels
      - MINIO_SERVER_URL=https://healthsync-files.loophole.site
      - MINIO_BROWSER_REDIRECT_URL=https://healthsync-console.loophole.site
    ports:
      - "9004:9000"  # Port 9004 để tránh xung đột
      - "9005:9001"  # Port 9005 để tránh xung đột
    volumes:
      - minio_data_prod:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - healthsync-network

  api:
    # Pull image from Docker Hub instead of building locally
    # Image name sẽ được thay thế tự động bởi Jenkins pipeline
    image: healthsync-api:latest
    # container_name: healthsync-api-prod  # Xóa vì dùng replicas: 2
    env_file:
      - .env.prod
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - JwtSettings__SecretKey=${JWT_SECRET_KEY:-Prod_HSync_2025_9d8f7a6c5b4e3d2a1f0e9d8c7b6a5f4e3d2a1f0e9d8c7b6a5f4e3d2a1f0e}
      - MinIO__Endpoint=minio:9000
      - MinIO__AccessKey=${MINIO_ACCESS_KEY:-minioadminprod}
      - MinIO__SecretKey=${MINIO_SECRET_KEY:-minioadminprod}
      - MinIO__BucketName=${MINIO_BUCKET_NAME:-healthsync-prod-images}
      - MinIO__UseSSL=false
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      replicas: 2
    volumes:
      - data_protection_keys:/root/.aspnet/DataProtection-Keys
    networks:
      - healthsync-network

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: healthsync-nginx-prod
    ports:
      - "9180:80"   # Port 9180 để tránh xung đột
      # - "9543:443"  # Comment out HTTPS port
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - healthsync-network
    # Healthcheck tạm thời tắt để debug tunnel
    # healthcheck:
    #   test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3

  tunnel-nginx:
    build:
      context: .
      dockerfile: Dockerfile.loophole
    container_name: healthsync-tunnel-nginx
    restart: unless-stopped
    command: ["http", "80", "nginx", "--hostname", "healthsync-api"]
    volumes:
      - /home/lakhanh/.loophole/tokens.json:/root/.loophole/tokens.json
    depends_on:
      - nginx
    networks:
      - healthsync-network

  tunnel-minio:
    build:
      context: .
      dockerfile: Dockerfile.loophole
    container_name: healthsync-tunnel-minio
    restart: unless-stopped
    command: ["http", "9000", "minio", "--hostname", "healthsync-files"]
    volumes:
      - /home/lakhanh/.loophole/tokens.json:/root/.loophole/tokens.json
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - healthsync-network

  tunnel-minio-console:
    build:
      context: .
      dockerfile: Dockerfile.loophole
    container_name: healthsync-tunnel-minio-console
    restart: unless-stopped
    command: ["http", "9001", "minio", "--hostname", "healthsync-console"]
    volumes:
      - /home/lakhanh/.loophole/tokens.json:/root/.loophole/tokens.json
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - healthsync-network

volumes:
  sqlserver_data_prod:
  minio_data_prod:
  data_protection_keys:

networks:
  healthsync-network:
    driver: bridge