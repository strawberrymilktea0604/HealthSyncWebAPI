services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: healthsync-db-prod
    env_file:
      - .env.prod
    environment:
      - MSSQL_PID=Standard
      - ACCEPT_EULA=Y
    ports:
      - "1433:1433"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 40s
    networks:
      - healthsync-network

  minio:
    image: minio/minio:latest
    container_name: healthsync-minio-prod
    env_file:
      - .env.prod
    environment:
      - MINIO_ROOT_USER=minioadminprod
      - MINIO_ROOT_PASSWORD=minioadminprod
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data_prod:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - healthsync-network

  api:
    image: healthsync-api:latest
    env_file:
      - .env.prod
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - JwtSettings__SecretKey=${JWT_SECRET_KEY:-Prod_HSync_2025_9d8f7a6c5b4e3d2a1f0e9d8c7b6a5f4e3d2a1f0e9d8c7b6a5f4e3d2a1f0e}
      - MinIO__Endpoint=minio:9000
      - MinIO__AccessKey=${MINIO_ACCESS_KEY:-minioadminprod}
      - MinIO__SecretKey=${MINIO_SECRET_KEY:-minioadminprod}
      - MinIO__BucketName=${MINIO_BUCKET_NAME:-healthsync-prod-images}
      - MinIO__UseSSL=false
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      replicas: 2
    volumes:
      - data_protection_keys:/root/.aspnet/DataProtection-Keys
    networks:
      - healthsync-network

  nginx:
    image: nginx:1.25-alpine
    container_name: healthsync-nginx-prod
    environment:
      - NGINX_PORT_HTTP=80
      - NGINX_PORT_HTTPS=443
      - Md3=
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - healthsync-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  sqlserver_data_prod:
  minio_data_prod:
  data_protection_keys:

networks:
  healthsync-network:
    driver: bridge
