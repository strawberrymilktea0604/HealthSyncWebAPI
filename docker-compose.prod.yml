services:
  db:
    container_name: healthsync-db-prod
    env_file:
      - .env.prod
    environment:
      - MSSQL_PID=Standard
      - ACCEPT_EULA=Y
    ports:
      - "1433:1433"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 40s

  minio:
    container_name: healthsync-minio-prod
    env_file:
      - .env.prod
    environment:
      - MINIO_ROOT_USER=minioadminprod
      - MINIO_ROOT_PASSWORD=minioadminprod
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data_prod:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  api:
    image: healthsync-api:latest
    container_name: healthsync-api-prod
    env_file:
      - .env.prod
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - JwtSettings__SecretKey=${JWT_SECRET_KEY:-Prod_HSync_2025_9d8f7a6c5b4e3d2a1f0e9d8c7b6a5f4e3d2a1f0e9d8c7b6a5f4e3d2a1f0e}
      - MinIO__Endpoint=minio:9000
      - MinIO__AccessKey=${MINIO_ACCESS_KEY:-minioadminprod}
      - MinIO__SecretKey=${MINIO_SECRET_KEY:-minioadminprod}
      - MinIO__BucketName=${MINIO_BUCKET_NAME:-healthsync-prod-images}
      - MinIO__UseSSL=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:1.25-alpine
    container_name: healthsync-nginx-prod
    env_file:
      - .env.prod
    ports:
      - "${NGINX_PORT_HTTP}:80"
      - "${NGINX_PORT_HTTPS}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - healthsync-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  jenkins:
    image: jenkins/jenkins:lts-alpine
    container_name: healthsync-jenkins-prod
    user: root
    env_file:
      - .env.prod
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins_data_prod:/var/jenkins_home
      - //var/run/docker.sock:/var/run/docker.sock
      - ./Jenkinsfile:/var/jenkins_home/Jenkinsfile:ro
    environment:
      - JENKINS_OPTS=--httpPort=8080
    restart: unless-stopped
    networks:
      - healthsync-network

volumes:
  sqlserver_data_prod:
  minio_data_prod:
  jenkins_data_prod:

networks:
  healthsync-network:
    driver: bridge
