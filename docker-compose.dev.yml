services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: healthsync-db
    env_file:
      - .env.dev
    environment:
      - MSSQL_PID=Express
      - ACCEPT_EULA=Y
    volumes:
      - sqlserver_data:/var/opt/mssql
    ports:
      - "1434:1433"
    networks:
      - healthsync-network
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 40s

  minio:
    image: minio/minio:latest
    container_name: healthsync-minio
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
      - MINIO_SERVER_URL=http://files.healthsync.local:9000
      - MINIO_BROWSER_REDIRECT_URL=http://console.healthsync.local:9001
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - healthsync-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.dev
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - JwtSettings__SecretKey=${JWT_SECRET_KEY:-HealthSync_Dev_Secret_Key_2025_!@_Secure_Token_Gen_9988}
      - MinIO__Endpoint=minio:9000
      - MinIO__AccessKey=${MINIO_ACCESS_KEY:-minioadmin}
      - MinIO__SecretKey=${MINIO_SECRET_KEY:-minioadmin}
      - MinIO__BucketName=healthsync-images
      - MinIO__UseSSL=false
      - DOTNET_USE_POLLING_FILE_WATCHER=1
    volumes:
      - .:/src:cached
      - /src/HealthSync.WebApi/bin
      - /src/HealthSync.WebApi/obj
      - ./data-protection-keys:/root/.aspnet/DataProtection-Keys
    command: ["dotnet", "watch", "run", "--project", "HealthSync.WebApi", "--urls", "http://0.0.0.0:8080"]
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - healthsync-network
    deploy:
      replicas: 2

  nginx:
    image: nginx:1.25-alpine
    container_name: healthsync-nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - healthsync-network

  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    container_name: healthsync-jenkins
    user: root
    volumes:
      - jenkins_data:/var/jenkins_home
      - //var/run/docker.sock:/var/run/docker.sock
      - ./Jenkinsfile:/var/jenkins_home/Jenkinsfile:ro
    environment:
      - JENKINS_OPTS=--httpPort=8080
    ports:
      - "8081:8080"
      - "50000:50000"
    networks:
      - healthsync-network

volumes:
  sqlserver_data:
  minio_data:
  jenkins_data:

networks:
  healthsync-network:
    driver: bridge