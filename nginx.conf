events {
    worker_connections 1024;
}

http {
    # 1. Định nghĩa nhóm Server Backend
    # Tên "api" phải khớp với tên service trong docker-compose.yml
    # Port "8080" là port mặc định của .NET 8 (không phải 80 nữa)
    upstream backend_servers {
        server api:8080;
    }

    server {
        listen 80;
        server_name _;

        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log warn;
        client_max_body_size 5M;

        # 2. Xử lý các request chính
        location / {
            proxy_pass http://backend_servers; # Trỏ về upstream đã định nghĩa ở trên
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # 3. Sửa lỗi Health check
        location /health {
            access_log off;
            # LỖI CŨ: proxy_pass http://healthsync_api;
            # SỬA LẠI: Trỏ về upstream backend_servers giống như ở trên
            proxy_pass http://backend_servers; 
            
            proxy_http_version 1.1;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}