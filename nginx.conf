events {
    worker_connections 1024;
}

http {
    # Upstream backend API with load balancing for 2 containers
    upstream backend_servers {
        server api:8080;
    }

    # HTTP server block (for development)
    server {
        listen 80;
        server_name _;

        # Logging
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log warn;

        # Client max body size for file uploads (5MB)
        client_max_body_size 5M;

        # Reverse proxy to API backend
        location / {
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;

            # Headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Buffering (disable for real-time APIs)
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # Health check endpoint (optional, for load balancers)
        location /health {
            access_log off;
            proxy_pass http://healthsync_api;
            proxy_http_version 1.1;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
